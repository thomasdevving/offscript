# Azure Developer CLI manifest: `azd up` provisions infra/azure/main.bicep and deploys the API.
name: parallel
metadata:
  template: parallel-football-intelligence
infra:
  provider: bicep
  path: infra/azure
  module: main
services:
  api:
    project: .
    language: python
    host: containerapp
    docker:
      path: infra/docker/api.Dockerfile
      context: .
      remoteBuild: true
# The web app is a static export uploaded to a Storage static website by scripts/deploy_azure.sh.
