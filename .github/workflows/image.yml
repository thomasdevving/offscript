name: API image

# Builds the API container and publishes it to GitHub Container Registry. Azure Container Apps pulls
# it from there, so no Azure registry (and no Azure build service) is needed.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "scenarios/**"
      - "infra/docker/api.Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/parallel-api:latest
            ghcr.io/${{ github.repository_owner }}/parallel-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=PARALLEL API (FastAPI + Microsoft Agent Framework)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
