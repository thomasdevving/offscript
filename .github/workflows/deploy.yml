name: Deploy to Azure

# Manual deployment (requires the repository to be configured as described in docs/deployment.md).
# Uses OpenID Connect - no long-lived Azure credentials are stored in GitHub.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: parallel-api

jobs:
  api:
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.url.outputs.api_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push image to Azure Container Registry
        run: |
          az acr build --registry "${{ vars.ACR_NAME }}" --image "$IMAGE_NAME:${{ github.sha }}" \
            --file infra/docker/api.Dockerfile .
      - name: Roll out new revision
        run: |
          az containerapp update --name "${{ vars.CONTAINER_APP_NAME }}" --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
      - id: url
        run: |
          fqdn=$(az containerapp show -n "${{ vars.CONTAINER_APP_NAME }}" -g "${{ vars.RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "api_url=https://$fqdn" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: curl --fail --retry 10 --retry-delay 6 "${{ steps.url.outputs.api_url }}/api/health"

  web:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.api.outputs.api_url }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload to the Storage static website
        run: |
          az storage blob upload-batch --account-name "${{ vars.WEB_STORAGE_ACCOUNT }}" --auth-mode login             -d '$web' -s apps/web/out --overwrite
