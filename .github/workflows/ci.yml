name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint, tests, contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
        env:
          AGENT_MODE: policy
      - name: OpenAPI contract is up to date
        working-directory: .
        run: |
          python scripts/export_openapi.py
          git diff --exit-code packages/contracts/openapi.json

  web:
    name: Web (types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript contracts match the OpenAPI schema
        run: npm run check -w packages/contracts
      - run: npm run typecheck -w apps/web
      - run: npm run test -w apps/web
      - run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  e2e:
    name: End-to-end (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r apps/api/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
        env:
          PARALLEL_PYTHON: python
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
